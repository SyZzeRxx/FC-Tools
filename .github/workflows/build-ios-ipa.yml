name: Build FC Tools iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Apply Swift concurrency compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("FC Tools iOS/FC Tools")
          settings = root / "Services/SettingsManager.swift"
          text = settings.read_text()
          text = text.replace("@MainActor\nfinal class SettingsManager", "final class SettingsManager")
          settings.write_text(text)
          cookies = root / "Services/CookieManager.swift"
          text = cookies.read_text()
          if "@MainActor\nstruct CookieManager" not in text:
              text = text.replace("struct CookieManager", "@MainActor\nstruct CookieManager")
          cookies.write_text(text)
          injector = root / "Services/ScriptInjector.swift"
          text = injector.read_text()
          marker = "    func install(into controller: WKUserContentController) throws"
          if "    @MainActor\n" + marker not in text:
              text = text.replace(marker, "    @MainActor\n" + marker)
          injector.write_text(text)
          PY

      - name: Build iPhone application
        run: |
          set -euo pipefail
          xcodebuild \
            -project "FC Tools iOS/FC Tools.xcodeproj" \
            -scheme "FC Tools" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/FCToolsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/FCToolsDerivedData/Build/Products/Release-iphoneos/FC Tools.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/FC-Tools-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FC-Tools-unsigned-IPA
          path: FC-Tools-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
